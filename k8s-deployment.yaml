apiVersion: apps/v1
kind: Deployment
metadata:
  name: evm-trackooor
  labels:
    app: evm-trackooor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: evm-trackooor
  template:
    metadata:
      labels:
        app: evm-trackooor
    spec:
      containers:
        - name: evm-trackooor
          image: evm-trackooor:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: health
          args:
            - "track"
            - "realtime"
            - "--config"
            - "/app/config.json"
            - "--verbose"
            - "--health-port"
            - "8080"
          resources:
            requests:
              cpu: "500m" # Request 0.5 CPU cores
              memory: "512Mi" # Request 512 MB of memory
            limits:
              cpu: "1000m" # Limit to 1 CPU core
              memory: "1Gi" # Limit to 1 GB of memory
          volumeMounts:
            - name: config-volume
              mountPath: /app/config.json
              subPath: config.json
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: config-volume
          configMap:
            name: evm-trackooor-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: evm-trackooor-config
data:
  config.json: |
    {
      # Your config file contents here
      # This is just a placeholder - replace with your actual configuration
    }
---
apiVersion: v1
kind: Service
metadata:
  name: evm-trackooor
  labels:
    app: evm-trackooor
spec:
  selector:
    app: evm-trackooor
  ports:
    - name: health
      port: 8080
      targetPort: 8080
  type: ClusterIP
